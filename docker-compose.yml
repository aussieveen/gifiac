services:
  caddy:
    # No ALB any more (COST-REDUCTION-PLAN.md step 1) — Caddy terminates
    # TLS straight on the instance using a Cloudflare Origin CA cert
    # (deploy.sh writes /opt/gifiac/certs/* from SSM), with Cloudflare set
    # to Full (Strict) in front. The security group only lets Cloudflare's
    # ranges reach 80/443 at all.
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/gifiac/certs:/certs:ro
    depends_on:
      - gifiac

  gifiac:
    # Built and published by .github/workflows/docker-publish.yml on every push to main.
    # Pin to a specific build instead of :latest by swapping in a yyyy.mm.dd.hh.mm tag.
    image: ghcr.io/aussieveen/gifiac:latest
    container_name: gifiac
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /opt/gifiac/data:/data
    environment:
      # Without this, tracing_subscriber's default filter is ERROR-only
      # (EnvFilter::from_default_env()'s default directive) — every
      # tracing::info! in the app, including per-request timing, is
      # silently dropped. tower_http=debug surfaces TraceLayer's built-in
      # per-request duration line alongside our own stage timings.
      RUST_LOG: "info,gifiac_backend=info,tower_http=debug"
      GIFIAC_VIDEO_DIR: /data/videos
      DATABASE_URL: "${DATABASE_URL}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME}"
      R2_PUBLIC_BASE_URL: "${R2_PUBLIC_BASE_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      APP_BASE_URL: "${APP_BASE_URL}"
      SOURCE_VIDEOS_S3_ACCESS_KEY_ID: "${SOURCE_VIDEOS_S3_ACCESS_KEY_ID}"
      SOURCE_VIDEOS_S3_SECRET_ACCESS_KEY: "${SOURCE_VIDEOS_S3_SECRET_ACCESS_KEY}"
      SOURCE_VIDEOS_S3_BUCKET: "${SOURCE_VIDEOS_S3_BUCKET}"
      SOURCE_VIDEOS_S3_REGION: "${SOURCE_VIDEOS_S3_REGION}"
      TEMPLATE_ASSETS_S3_BUCKET: "${TEMPLATE_ASSETS_S3_BUCKET}"
      TEMPLATE_ASSETS_S3_REGION: "${TEMPLATE_ASSETS_S3_REGION}"
      LOGIN_CODE_HMAC_KEY: "${LOGIN_CODE_HMAC_KEY}"
      MAILER: "${MAILER}"
      EMAIL_FROM_ADDRESS: "${EMAIL_FROM_ADDRESS}"
      SES_REGION: "${SES_REGION}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY}"
      TRUST_CF_CONNECTING_IP: "${TRUST_CF_CONNECTING_IP}"
