name: Build and publish Docker image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute timestamp tag
        id: timestamp
        run: echo "tag=$(date -u +'%Y.%m.%d.%H.%M')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.timestamp.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Needed now that this job also reads docker-compose.yml from the
      # repo (see the SSM step below) — previously this job never touched
      # any repo file, only triggered the on-instance script.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # terraform/files/deploy.sh already lives on the instance (written by
      # user_data.sh.tftpl at first boot) — this just re-runs it, so the
      # deploy logic lives in one place, not duplicated here. But
      # docker-compose.yml is ALSO only written at first boot (same
      # user_data.sh.tftpl) and deploy.sh never touches it — so without
      # re-pushing it here on every deploy, edits to docker-compose.yml in
      # this repo (e.g. env vars, ports, volumes) would silently never
      # reach the running instance. Sent as base64 over SSM's shorthand
      # `commands=[...]` param to dodge quoting the file's own YAML.
      - name: Trigger deploy via SSM
        run: |
          compose_b64="$(base64 -w0 docker-compose.yml)"
          params="$(jq -n --arg b64 "$compose_b64" \
            '{commands: ["echo " + $b64 + " | base64 -d > /opt/gifiac/docker-compose.yml", "bash /opt/gifiac/deploy.sh"]}')"

          command_id=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=gifiac" \
            --document-name "AWS-RunShellScript" \
            --parameters "$params" \
            --query "Command.CommandId" --output text)

          sleep 3
          instance_id=$(aws ssm list-command-invocations \
            --command-id "$command_id" \
            --query "CommandInvocations[0].InstanceId" --output text)

          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance_id" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "deploy status: $status"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for deploy to finish"
          exit 1
