[package]
name = "gifiac-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-sdk-s3 = "1.143.0"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
ffmpeg-next = "9.0.0"
reqwest = "0.13.4"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "uuid", "chrono"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = "0.13.4"
